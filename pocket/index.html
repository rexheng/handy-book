<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2f3b24">
  <title>Handy Book</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../shared/icon.svg">
  <link rel="apple-touch-icon" href="../shared/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/flow.css">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background: #cfd8b8; color: #24301c; font-family: Literata, Georgia, serif; min-height: 100dvh; }
    .card {
      max-width: 390px; min-height: 100dvh; margin: 0 auto;
      background: repeating-linear-gradient(#0000 0 27px, #24301c14 28px), #e7eed8;
      padding: max(22px, env(safe-area-inset-top)) 18px 96px;
      box-shadow: 0 0 0 1px #24301c22, 8px 0 0 #8b3a2a inset;
    }
    .rub { font-family: "IBM Plex Mono", monospace; font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; }
    h1 { font-size: 1.85rem; font-weight: 700; margin: 8px 0 18px; }
    screen.on { animation: lift .3s ease; }
    @keyframes lift { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none;} }
    input[type=text], input[type=email] {
      width:100%; background: transparent; border: 0; border-bottom: 1px solid #24301c; font: inherit; padding: 6px 0 8px; color: inherit;
    }
    button { font-family: "IBM Plex Mono", monospace; font-size: .75rem; background: #2f3b24; color: #e7eed8; border: 0; padding: 12px; cursor: pointer; }
    button:not(.primary) { }
    .soft { background: transparent; color: #2f3b24; outline: 1px solid #2f3b24; }
    .polaroid { background: #f7f4ea; padding: 8px 8px 28px; width: 70%; transform: rotate(-2deg); box-shadow: 2px 3px 0 #24301c22; margin: 8px 0 18px; }
    .polaroid .img { height: 110px; background: #9aa57a center/cover; }
    nav.tab {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
      width: min(390px, calc(100% - 24px)); display:grid; grid-template-columns: repeat(5,1fr);
      background: #2f3b24; padding: 6px;
    }
    nav.tab button { background: transparent; color: #e7eed8; padding: 10px 2px; font-size:.65rem; }
    .sys, .partcard { background:#f7f4ea; outline: 1px solid #24301c33; }
    .sys.open { background:#2f3b24; color:#e7eed8; }
    .verbatim { background:#f7f4ea; }
  </style>
</head>
<body>
  <div class="card">
    <div class="rub">Handy Book · field</div>
    <div class="flow-steps">
      <span data-step="identify" class="now">1 Name</span>
      <span data-step="confirm">2 Confirm</span>
      <span data-step="pick">3 Part</span>
      <span data-step="library">4 Page</span>
      <span data-step="repair">5 List</span>
      <span data-step="invoice">6 Kit</span>
    </div>
    <screen id="identify" class="on">
      <h1>Name it or shoot it.</h1>
      <input id="q" type="text" placeholder="CB650R">
      <div class="row" style="grid-template-columns:1fr 1fr">
        <button id="find">Find</button>
        <button class="soft" id="camBtn">Photo</button>
      </div>
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
      <p id="scanNote" class="hint" hidden>Hold.</p>
    </screen>
    <screen id="confirm">
      <figure class="polaroid">
        <div class="img sil" data-photo></div>
        <figcaption class="rub" id="bikeMatch"></figcaption>
      </figure>
      <h1 id="bikeName"></h1>
      <p id="bikeMeta"></p>
      <div class="row">
        <button data-act="yes">Yes</button>
        <button class="soft" data-act="no">No</button>
      </div>
    </screen>
    <screen id="pick">
      <h1>Which part?</h1>
      <div id="sysGrid" class="sysgrid"></div>
      <div id="partGrid" class="partgrid"></div>
    </screen>
    <screen id="library">
      <h1>The page</h1>
      <div class="lib-track"><div class="lib-bar" id="libBar"></div></div>
      <div class="lib-log" id="libLog"></div>
      <div id="libPage" hidden></div>
    </screen>
    <screen id="repair">
      <h1>Pages</h1>
      <div id="repairBody"></div>
    </screen>
    <screen id="invoice">
      <h1>Kit</h1>
      <div id="invoiceBody"></div>
    </screen>
  </div>
  <nav class="tab" id="nav" hidden>
    <button data-go="confirm">Bike</button>
    <button data-go="pick">Part</button>
    <button data-go="library">Page</button>
    <button data-go="repair">List</button>
    <button data-go="invoice">Kit</button>
  </nav>
  <script src="../shared/data.js"></script>
  <script src="../shared/flow.js"></script>
  <script>HandyFlow.bind({});</script>
</body>
</html>
