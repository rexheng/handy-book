<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3d2b1f">
  <title>Handy Book</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../shared/icon.svg">
  <link rel="apple-touch-icon" href="../shared/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/flow.css">
  <style>
    :root { --wood:#6b4226; --paper:#f4e6c8; --ink:#24180f; --stamp:#9c2b12; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 20% 0%, #8b5a2b 0%, transparent 50%),
        repeating-linear-gradient(90deg, #5a3a22 0 18px, #4a2f1c 18px 20px);
      background-color: #4e321f;
    }
    app-shell { display:block; min-height:100dvh; padding: max(16px, env(safe-area-inset-top)) 14px 24px; }
    .clip {
      max-width: 440px; margin: 0 auto; background: var(--paper);
      box-shadow: 0 18px 0 #1a120c, 0 0 0 1px #0003;
      position: relative; min-height: calc(100dvh - 40px); padding: 28px 22px 88px;
    }
    header { display:flex; justify-content:space-between; align-items:baseline; border-bottom: 2px dashed #24180f55; padding-bottom: 10px; margin-bottom: 18px; }
    h1 { font-family: Syne, sans-serif; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em; }
    .brand { font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color:#6b4226; }
    screen.on { animation: in .35s ease; }
    @keyframes in { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform:none;} }
    label { display:block; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px; }
    input[type=text], input[type=email] {
      width:100%; background:transparent; border:none; border-bottom: 2px solid var(--ink);
      font: inherit; font-size:1.15rem; padding: 8px 0 10px; color: inherit;
    }
    input:focus { outline:none; }
    button, .btn {
      font: inherit; cursor:pointer; border: 2px solid var(--ink);
      background: #ead7a8; color: var(--ink); padding: 14px 16px; text-align:left;
    }
    button.primary { background: var(--ink); color: var(--paper); }
    .photo { margin-top: 12px; aspect-ratio: 4/3; background: #1f1710; border: 10px solid #f7f0e0; box-shadow: 0 8px 0 #0002; overflow: hidden; }
    .photo [data-photo] { width:100%; height:100%; }
    .stamp { display:inline-block; border: 3px solid var(--stamp); color: var(--stamp); padding: 4px 8px; transform: rotate(-8deg); font-weight: 600; margin: 12px 0; }
    footer.dock { position: sticky; bottom: 12px; display:flex; gap:8px; margin-top: 28px; }
    footer.dock button { flex:1; text-align:center; padding:12px 8px; font-size:.72rem; }
    .sys, .partcard { background:#fff8e8; }
    .sys.open { background: var(--ink); color: var(--paper); }
    .verbatim { background:#fff8e8; border:1px solid #24180f33; }
  </style>
</head>
<body>
  <app-shell>
    <div class="clip">
      <header>
        <div>
          <div class="brand">Handy Book</div>
          <h1 id="title">On the bench</h1>
        </div>
        <div id="clock"></div>
      </header>
      <div class="flow-steps" aria-hidden="true">
        <span data-step="identify" class="now">1 Name</span>
        <span data-step="confirm">2 Confirm</span>
        <span data-step="pick">3 Part</span>
        <span data-step="library">4 Book</span>
        <span data-step="repair">5 Pages</span>
        <span data-step="invoice">6 Invoice</span>
      </div>

      <screen id="identify" class="on">
        <label for="q">Bike name</label>
        <input id="q" type="text" autocomplete="off" placeholder="Honda CB650R">
        <div class="row">
          <button class="primary" id="find">Look it up</button>
          <button id="camBtn">Take a photo</button>
        </div>
        <input id="file" type="file" accept="image/*" capture="environment" hidden>
        <p id="scanNote" class="hint" hidden>Matching the shop copy…</p>
      </screen>

      <screen id="confirm">
        <div class="stamp">Match</div>
        <div class="photo"><div class="sil" data-photo></div></div>
        <p id="bikeName" style="margin-top:12px;font-family:Syne,sans-serif;font-size:1.4rem"></p>
        <p id="bikeMeta" class="hint"></p>
        <p id="bikeEngine"></p>
        <div class="row">
          <button class="primary" data-act="yes">Yes, this one</button>
          <button data-act="no">No</button>
        </div>
      </screen>

      <screen id="pick">
        <div id="sysGrid" class="sysgrid"></div>
        <div id="partGrid" class="partgrid" style="margin-top:12px"></div>
      </screen>

      <screen id="library">
        <div class="lib-track"><div class="lib-bar" id="libBar"></div></div>
        <div class="lib-log" id="libLog"></div>
        <div id="libPage" hidden></div>
      </screen>

      <screen id="repair">
        <div id="repairBody"></div>
      </screen>

      <screen id="invoice">
        <div id="invoiceBody"></div>
      </screen>

      <footer class="dock" id="dock" hidden>
        <button data-go="confirm">Bike</button>
        <button data-go="pick">Part</button>
        <button data-go="library">Book</button>
        <button data-go="repair">Pages</button>
        <button data-go="invoice">Invoice</button>
      </footer>
    </div>
  </app-shell>
  <script src="../shared/data.js"></script>
  <script src="../shared/flow.js"></script>
  <script>
    document.getElementById("clock").textContent = new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    HandyFlow.bind({
      titleEl: "title",
      titles: { identify:"On the bench", confirm:"Your bike", pick:"Which part?", library:"The book", repair:"Pages", invoice:"Invoice" }
    });
  </script>
</body>
</html>
