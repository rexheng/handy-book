<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>Handy Book</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../shared/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/flow.css">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; background:#050505; color:#f3e6c4; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: radial-gradient(1200px 500px at 50% -10%, #3a2a12 0%, #050505 55%);
    }
    .beam { pointer-events:none; position:fixed; inset:0; background: radial-gradient(ellipse at 50% 18%, #ffbf5533, transparent 42%); }
    main {
      min-height: 100dvh; max-width: 420px; margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 20px 32px;
      display:flex; flex-direction:column; gap: 18px;
    }
    .mark { font-size:.7rem; letter-spacing:.28em; text-transform:uppercase; color:#c9a36a; }
    h1 { font-family: "Archivo Black", sans-serif; letter-spacing: -0.03em; line-height: .92; font-size: clamp(2.2rem, 11vw, 3.2rem); }
    screen.on { display:flex; flex-direction:column; gap: 16px; animation: fade .4s ease; }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    input, button { font: inherit; color: inherit; width: 100%; }
    input { background: transparent; border: 0; border-bottom: 2px solid #f3e6c4; font-size: 1.3rem; padding: 10px 0 14px; }
    input:focus { outline: none; }
    button { border: 0; background: #f3e6c4; color: #111; font-weight: 600; padding: 16px 14px; text-align: left; }
    button.ghost, button:not(.primary):not(.sys):not(.partcard) { }
    .ghost { background: transparent !important; color: #f3e6c4 !important; border: 2px solid #f3e6c4 !important; }
    .cam { aspect-ratio: 4/3; background:#000; border-radius: 8px; overflow:hidden; outline: 2px solid #f3e6c455; }
    .cam [data-photo] { width:100%; height:100%; }
    nav { display:grid; grid-template-columns: repeat(5,1fr); gap:8px; }
    nav button { padding: 12px 4px; font-size:.72rem; text-align:center; }
    .muted { color:#c9a36a; }
    .sys, .partcard { background:#16120c; color:#f3e6c4; border:1px solid #f3e6c433; }
    .sys.open { background:#f3e6c4; color:#111; }
    .verbatim { background:#0e0c09; color:#f3e6c4; }
    .flow-steps { color:#c9a36a; }
  </style>
</head>
<body>
  <div class="beam"></div>
  <main>
    <div class="mark">Handy Book</div>
    <div class="flow-steps">
      <span data-step="identify" class="now">1 Name</span>
      <span data-step="confirm">2 Confirm</span>
      <span data-step="pick">3 Part</span>
      <span data-step="library">4 Book</span>
      <span data-step="repair">5 Pages</span>
      <span data-step="invoice">6 Invoice</span>
    </div>
    <screen id="identify" class="on">
      <h1>What’s the bike?</h1>
      <input id="q" type="text" placeholder="Name">
      <div class="row">
        <button id="find">Find it</button>
        <button class="ghost" id="camBtn">Photo</button>
      </div>
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
      <p id="scanNote" class="muted" hidden>Hold still.</p>
    </screen>
    <screen id="confirm">
      <div class="muted" id="bikeYear"></div>
      <h1 id="bikeName"></h1>
      <div class="cam"><div class="sil" data-photo></div></div>
      <p id="bikeMeta" class="muted"></p>
      <div class="row">
        <button data-act="yes">Yes</button>
        <button class="ghost" data-act="no">No</button>
      </div>
    </screen>
    <screen id="pick">
      <h1>Which part?</h1>
      <div id="sysGrid" class="sysgrid"></div>
      <div id="partGrid" class="partgrid"></div>
    </screen>
    <screen id="library">
      <h1>The book</h1>
      <div class="lib-track"><div class="lib-bar" id="libBar"></div></div>
      <div class="lib-log" id="libLog"></div>
      <div id="libPage" hidden></div>
    </screen>
    <screen id="repair">
      <h1>Pages</h1>
      <div id="repairBody"></div>
    </screen>
    <screen id="invoice">
      <h1>Get it</h1>
      <div id="invoiceBody"></div>
    </screen>
    <nav id="nav" hidden>
      <button data-go="confirm">Bike</button>
      <button data-go="pick">Part</button>
      <button data-go="library">Book</button>
      <button data-go="repair">Pages</button>
      <button data-go="invoice">Bill</button>
    </nav>
  </main>
  <script src="../shared/data.js"></script>
  <script src="../shared/flow.js"></script>
  <script>HandyFlow.bind({});</script>
</body>
</html>
