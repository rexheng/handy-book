<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b2c2c">
  <title>Handy Book</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../shared/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/flow.css">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background: #2b2420; color: #2a221c; font-family: Newsreader, Georgia, serif; min-height: 100dvh; }
    .shelf { min-height: 100dvh; display:grid; place-items:center; padding: 20px 12px 28px; }
    .book { width: min(920px, 100%); min-height: min(640px, 92dvh); display:grid; grid-template-columns: 28px 1fr; background: #5b2c2c; box-shadow: 12px 18px 40px #0008; }
    .spine {
      background: linear-gradient(90deg, #3a1a1a, #6e3535 40%, #4a2222);
      writing-mode: vertical-rl; transform: rotate(180deg); color: #ead9c0;
      letter-spacing: .3em; font-family: "Cormorant Garamond", serif; font-size: .85rem;
      display:flex; align-items:center; justify-content:center; padding: 16px 0;
    }
    .leaf { background: linear-gradient(90deg, #cbb79a 0 12px, #f6edd9 12px); padding: 28px 22px 24px 32px; position: relative; }
    h1 { font-family: "Cormorant Garamond", serif; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 600; }
    .chap { font-variant: small-caps; letter-spacing:.12em; }
    screen.on { animation: turn .45s ease; }
    @keyframes turn { from { opacity:.4; transform: rotateY(-6deg); transform-origin: left; } to { opacity:1; transform:none; } }
    label { display:block; font-style: italic; margin-bottom: 8px; }
    input[type=text], input[type=email] {
      width:100%; border:0; border-bottom:1px solid #2a221c; background:transparent;
      font: inherit; font-size:1.25rem; padding: 6px 0 8px; color:inherit;
    }
    button { font: inherit; background: none; border:0; border-bottom: 1px solid #2a221c; cursor: pointer; padding: 4px 0; color: inherit; width:auto; }
    button.primary { font-weight: 600; }
    .sys, .partcard { background:#efe4cc; border: 1px solid #2a221c22; padding: 10px; }
    .sys.open { background:#5b2c2c; color:#ead9c0; }
    nav.foot { display:flex; gap:18px; margin-top: 28px; flex-wrap:wrap; }
    .photo { width: 160px; height: 110px; background: #d9c8a8; outline: 1px solid #2a221c44; }
    .photo [data-photo], [data-photo] { width:100%; height:100%; }
    .verbatim { background:#efe6d2; }
  </style>
</head>
<body>
  <div class="shelf">
    <div class="book">
      <div class="spine">HANDY BOOK</div>
      <div class="leaf">
        <div class="chap">Shop copy</div>
        <div class="flow-steps">
          <span data-step="identify" class="now">I Name</span>
          <span data-step="confirm">II Confirm</span>
          <span data-step="pick">III Part</span>
          <span data-step="library">IV Plate</span>
          <span data-step="repair">V Order</span>
          <span data-step="invoice">VI Invoice</span>
        </div>
        <screen id="identify" class="on">
          <h1>Write the model.</h1>
          <label for="q">Model</label>
          <input id="q" type="text" placeholder="Honda CB650R">
          <div class="row" style="grid-template-columns:auto auto; justify-content:start; gap:18px">
            <button id="find">Look up</button>
            <button id="camBtn">Photograph</button>
          </div>
          <input id="file" type="file" accept="image/*" capture="environment" hidden>
          <p id="scanNote" class="hint" hidden>Turning the catalog…</p>
        </screen>
        <screen id="confirm">
          <div class="photo sil" data-photo></div>
          <p class="chap" id="bikeYear"></p>
          <h1 id="bikeName"></h1>
          <p id="bikeMeta"></p>
          <div class="row" style="grid-template-columns:auto auto; justify-content:start; gap:18px">
            <button class="primary" data-act="yes">Yes</button>
            <button data-act="no">No</button>
          </div>
        </screen>
        <screen id="pick">
          <h1>Which part?</h1>
          <div id="sysGrid" class="sysgrid"></div>
          <div id="partGrid" class="partgrid"></div>
        </screen>
        <screen id="library">
          <h1>The plate</h1>
          <div class="lib-track"><div class="lib-bar" id="libBar"></div></div>
          <div class="lib-log" id="libLog"></div>
          <div id="libPage" hidden></div>
        </screen>
        <screen id="repair">
          <h1>Order of pages</h1>
          <div id="repairBody"></div>
        </screen>
        <screen id="invoice">
          <h1>Account</h1>
          <div id="invoiceBody"></div>
        </screen>
        <nav class="foot" id="nav" hidden>
          <button data-go="confirm">Bike</button>
          <button data-go="pick">Part</button>
          <button data-go="library">Plate</button>
          <button data-go="repair">Order</button>
          <button data-go="invoice">Account</button>
        </nav>
      </div>
    </div>
  </div>
  <script src="../shared/data.js"></script>
  <script src="../shared/flow.js"></script>
  <script>HandyFlow.bind({});</script>
</body>
</html>
