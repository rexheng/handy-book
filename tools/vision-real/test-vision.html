<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Part scan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Barlow, system-ui, sans-serif;
      background: repeating-linear-gradient(0deg, #ece7dc 0 24px, #e4dfd2 24px 25px), #ece7dc;
      color: #141414;
      min-height: 100dvh;
    }
    .ticket {
      background: #e85d04; color: #fff; padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 800; letter-spacing: .08em; border-bottom: 3px solid #141414;
    }
    .ticket b { font-family: "Big Shoulders Display", sans-serif; font-size: 1.6rem; letter-spacing: 0; }
    main { max-width: 420px; margin: 0 auto; padding: 16px 14px 40px; }
    h1 {
      font-family: "Big Shoulders Display", sans-serif;
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      text-transform: uppercase; line-height: .9; margin: 12px 0 16px;
    }
    button, label.file {
      font: inherit; font-weight: 800; text-transform: uppercase;
      border: 3px solid #141414; background: #ffe600;
      padding: 14px 12px; cursor: pointer; display: block; width: 100%;
      text-align: center;
    }
    button.primary { background: #141414; color: #fff; }
    button.ep { background: #fff; margin-bottom: 8px; }
    button.ep.on { background: #e85d04; color: #fff; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 14px; }
    #file { display: none; }
    .cam {
      border: 3px solid #141414; background: #141414; min-height: 220px;
      margin-bottom: 12px;
    }
    .cam img { width: 100%; height: auto; display: block; }
    #status {
      font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      font-size: .8rem; margin-bottom: 10px; min-height: 1.2em;
    }
    ol {
      list-style: none; background: #fff; border: 3px solid #141414;
    }
    ol li {
      display: grid; grid-template-columns: 1fr auto;
      padding: 10px 12px; border-bottom: 3px solid #141414;
      font-weight: 800; text-transform: uppercase;
    }
    ol li:last-child { border-bottom: 0; }
    .id { font-weight: 600; color: #e85d04; font-size: .75rem; letter-spacing: .04em; }
    .samples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .samples button {
      width: auto; padding: 10px 10px; font-size: .7rem; background: #fff;
      min-height: 44px;
    }
    #parity {
      margin-top: 18px; background: #fff; border: 3px solid #141414;
      display: none;
    }
    #parity table { width: 100%; border-collapse: collapse; font-size: .68rem; }
    #parity th, #parity td {
      border-bottom: 2px solid #141414; padding: 6px 8px; text-align: left;
      font-weight: 600; text-transform: uppercase;
    }
    #parity th { font-weight: 800; background: #ffe600; }
    #parity tr.ok td:last-child { color: #1a7f37; }
    #parity tr.bad td:last-child { color: #c1121f; }
    #parity-status {
      font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      font-size: .8rem; padding: 10px 8px; border-bottom: 3px solid #141414;
    }
  </style>
</head>
<body>
  <div class="ticket"><span>HANDY BOOK</span><b>R4</b></div>
  <main>
    <h1>Part scan</h1>
    <p id="status">LOAD</p>
    <div class="row">
      <button type="button" class="ep on" id="epWasm" data-ep="wasm">WASM</button>
      <button type="button" class="ep" id="epGpu" data-ep="webgpu">WebGPU</button>
    </div>
    <label class="file primary" for="file">Photo</label>
    <input id="file" type="file" accept="image/*" capture="environment">
    <div class="cam"><img id="preview" alt="" hidden></div>
    <ol id="top"></ol>
    <div class="samples" id="samples"></div>
    <section id="parity">
      <p id="parity-status">PARITY</p>
      <table>
        <thead>
          <tr><th>image</th><th>py</th><th>js</th><th>Δ</th><th>part</th><th></th></tr>
        </thead>
        <tbody id="parity-body"></tbody>
      </table>
    </section>
  </main>
  <script type="module">
    import { loadPartModel, classifyPart } from "./vision.js";

    const samples = [
      ["spark_plug.jpg", "plug"],
      ["ngk_plugs.jpg", "ngk"],
      ["brake_pad.jpg", "pad"],
      ["clutch_plate.jpg", "clutch"],
      ["battery.jpg", "battery"],
      ["chain.jpg", "chain"],
      ["disc.jpg", "disc"],
      ["handlebar.jpg", "bars"],
      ["fuel_tank.jpg", "tank"],
      ["radiator.jpg", "rad"],
      ["forks.jpg", "forks"],
      ["piston.jpg", "piston"],
      ["gear_lever.jpg", "shift"],
    ];

    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const topEl = document.getElementById("top");
    const fileEl = document.getElementById("file");
    const sampleBox = document.getElementById("samples");
    let providers = ["wasm"];
    let provider = "";

    function setEp(ep) {
      providers = ep === "webgpu" ? ["webgpu", "wasm"] : ["wasm"];
      document.getElementById("epWasm").classList.toggle("on", ep === "wasm");
      document.getElementById("epGpu").classList.toggle("on", ep === "webgpu");
    }

    async function boot() {
      status.textContent = "LOAD";
      try {
        const loaded = await loadPartModel({
          onProgress: (pct, detail) => {
            status.textContent = `${Math.round((pct || 0) * 100)} ${detail || ""}`;
          },
          executionProviders: providers,
        });
        provider = loaded.provider;
        status.textContent = provider.toUpperCase();
        await runParity();
      } catch (err) {
        status.textContent = String(err);
        console.error(err);
      }
    }

    function idsLabel(row) {
      const ids = (row.partIds && row.partIds.length)
        ? row.partIds.join(" ")
        : "—";
      const auto = row.partId || "—";
      const amb = row.ambiguous ? " AMB" : "";
      return `${ids} · ${auto}${amb}`;
    }

    async function run(img) {
      const t0 = performance.now();
      const top = await classifyPart(img);
      const wall = Math.round(performance.now() - t0);
      const inf = Math.round(top.ms || 0);
      status.textContent = `${(provider || "").toUpperCase()}  ${inf}ms inf  ${wall}ms wall`;
      topEl.replaceChildren();
      for (const row of top) {
        const li = document.createElement("li");
        const left = document.createElement("div");
        left.textContent = row.className.replaceAll("_", " ");
        const id = document.createElement("div");
        id.className = "id";
        id.textContent = idsLabel(row);
        const right = document.createElement("div");
        right.textContent = row.score.toFixed(3);
        const wrap = document.createElement("div");
        wrap.append(left, id);
        li.append(wrap, right);
        topEl.append(li);
      }
    }

    function show(url) {
      preview.hidden = false;
      preview.onload = () => run(preview);
      preview.src = url;
    }

    async function bitmapFromUrl(url) {
      const blob = await fetch(url).then((r) => {
        if (!r.ok) throw new Error(`${url} ${r.status}`);
        return r.blob();
      });
      return createImageBitmap(blob, { colorSpaceConversion: "none", resizeQuality: "high" });
    }

    async function runParity() {
      const box = document.getElementById("parity");
      const body = document.getElementById("parity-body");
      const line = document.getElementById("parity-status");
      let ref;
      try {
        const res = await fetch("./model/reference.json");
        if (!res.ok) return;
        ref = await res.json();
      } catch {
        return;
      }
      const images = ref.images || [];
      if (!images.length) return;
      box.style.display = "block";
      line.textContent = "PARITY …";
      body.replaceChildren();
      let pass = 0;
      const rows = [];
      for (const rec of images) {
        const url = `./test-imgs/${rec.file}`;
        let bmp;
        try {
          bmp = await bitmapFromUrl(url);
        } catch (err) {
          console.error(err);
          continue;
        }
        const top = await classifyPart(bmp);
        if (typeof bmp.close === "function") bmp.close();
        const js = top[0];
        const dScore = Math.abs((js?.score || 0) - rec.score);
        const same = js && js.className === rec.className && dScore <= 0.02;
        if (same) pass += 1;
        rows.push({
          file: rec.file,
          pyClass: rec.className,
          pyScore: rec.score,
          jsClass: js?.className || "",
          jsScore: js?.score || 0,
          dScore,
          partId: js?.partId ?? null,
          partIds: js?.partIds || [],
          ok: same,
        });
        const tr = document.createElement("tr");
        tr.className = same ? "ok" : "bad";
        tr.dataset.file = rec.file;
        tr.dataset.ok = same ? "1" : "0";
        tr.dataset.partId = js?.partId || "";
        const cells = [
          rec.file.replace(".jpg", ""),
          `${rec.className} ${rec.score.toFixed(3)}`,
          `${js?.className || "—"} ${(js?.score || 0).toFixed(3)}`,
          dScore.toFixed(3),
          js?.partId || "—",
          same ? "Y" : "N",
        ];
        for (const t of cells) {
          const td = document.createElement("td");
          td.textContent = t;
          tr.append(td);
        }
        body.append(tr);
      }
      const n = rows.length;
      line.textContent = `PARITY ${pass}/${n}  Δ≤0.02`;
      line.dataset.pass = String(pass);
      line.dataset.n = String(n);
      window.__parity = { pass, n, rows };
    }

    fileEl.addEventListener("change", () => {
      const f = fileEl.files && fileEl.files[0];
      if (!f) return;
      show(URL.createObjectURL(f));
    });

    document.getElementById("epWasm").addEventListener("click", async () => {
      setEp("wasm");
      await boot();
    });
    document.getElementById("epGpu").addEventListener("click", async () => {
      setEp("webgpu");
      await boot();
    });

    for (const [file, label] of samples) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.addEventListener("click", () => show(`./test-imgs/${file}`));
      sampleBox.append(b);
    }

    boot();
  </script>
</body>
</html>
