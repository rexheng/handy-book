<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bus test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Barlow, system-ui, sans-serif;
      background: #ece7dc;
      color: #141414;
      min-height: 100dvh;
    }
    .ticket {
      background: #e85d04;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      font-weight: 800;
    }
    main { max-width: 720px; margin: 0 auto; padding: 16px 14px 32px; }
    .rail {
      list-style: none;
      display: flex;
      gap: 8px;
      margin: 12px 0 16px;
    }
    .rail li {
      flex: 1;
      border: 3px solid #141414;
      background: #fff;
      text-align: center;
      font-weight: 800;
      padding: 10px 0;
      min-height: 44px;
    }
    .rail li.done { background: #ffe600; }
    .rail li.now { background: #e85d04; color: #fff; }
    section[data-screen] {
      border: 3px solid #141414;
      background: #fff;
      min-height: 88px;
      padding: 16px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
    button {
      font: inherit;
      font-weight: 800;
      text-transform: uppercase;
      border: 3px solid #141414;
      background: #ffe600;
      padding: 12px 8px;
      cursor: pointer;
      min-height: 44px;
    }
    #meta { font-weight: 800; margin: 8px 0 16px; }
    #log, #cases {
      list-style: none;
      background: #fff;
      border: 3px solid #141414;
      padding: 10px;
      min-height: 120px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
    }
    #log li, #cases li { padding: 2px 0; }
    #cases { min-height: 72px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="ticket"><span>BUS</span><b>A-17</b></div>
  <main>
    <ol class="rail">
      <li data-step="identify">1</li>
      <li data-step="confirm">2</li>
      <li data-step="pick">3</li>
      <li data-step="book">4</li>
      <li data-step="follow">5</li>
      <li data-step="invoice">6</li>
    </ol>
    <section data-screen="identify" hidden><div data-root></div></section>
    <section data-screen="confirm" hidden><div data-root></div></section>
    <section data-screen="pick" hidden><div data-root></div></section>
    <section data-screen="book" hidden><div data-root></div></section>
    <section data-screen="follow" hidden><div data-root></div></section>
    <section data-screen="invoice" hidden><div data-root></div></section>
    <p id="meta"></p>
    <div class="row">
      <button type="button" data-go="identify">identify</button>
      <button type="button" data-go="confirm">confirm</button>
      <button type="button" data-go="pick">pick</button>
      <button type="button" data-go="book">book</button>
      <button type="button" data-go="follow">follow</button>
      <button type="button" data-go="invoice">invoice</button>
    </div>
    <div class="row">
      <button type="button" id="run-cases">run cases</button>
    </div>
    <ol id="cases"></ol>
    <ol id="log"></ol>
  </main>
  <script type="module">
    import { FLOW, go, on, registerScreen, state } from "../counter/js/bus.js";

    const logEl = document.getElementById("log");
    const metaEl = document.getElementById("meta");
    const casesEl = document.getElementById("cases");
    const bootProbe = new URLSearchParams(location.search).has("boot-probe");
    const autoCases = new URLSearchParams(location.search).has("cases");

    function log(line) {
      const li = document.createElement("li");
      li.textContent = line;
      logEl.appendChild(li);
    }

    function caseLine(line) {
      const li = document.createElement("li");
      li.textContent = line;
      casesEl.appendChild(li);
    }

    function lines() {
      return [...logEl.querySelectorAll("li")].map((li) => li.textContent);
    }

    function refreshMeta() {
      const visible = [...document.querySelectorAll("section[data-screen]")].find((s) => !s.hidden);
      const now = document.querySelector("li[data-step].now");
      metaEl.textContent =
        (location.hash || "#") +
        " bikeId=" + JSON.stringify(state.bikeId) +
        " screen=" + (visible ? visible.getAttribute("data-screen") : "none") +
        " rail=" + (now ? now.getAttribute("data-step") : "none");
    }

    function stub(id) {
      return {
        mount(root) {
          log("mount " + id);
          if (root) root.textContent = id;
        },
        enter(params) {
          log("enter " + id + (params && params.replace ? " replace" : ""));
        },
        leave() {
          log("leave " + id);
        },
      };
    }

    function registerAll() {
      FLOW.forEach((id) => registerScreen(id, stub(id)));
    }

    on("screen", (p) => {
      log("event screen " + p.id);
      refreshMeta();
    });
    on("state", (p) => log("event state " + JSON.stringify(p)));

    document.querySelectorAll("[data-go]").forEach((btn) => {
      btn.addEventListener("click", () => go(btn.getAttribute("data-go")));
    });

    window.addEventListener("popstate", () => queueMicrotask(refreshMeta));

    async function probeBootRace() {
      const early = [];
      const off = (p) => early.push(p.id);
      on("screen", off);
      await new Promise((r) => setTimeout(r, 50));
      const before = {
        hash: location.hash,
        events: early.slice(),
        anyVisible: [...document.querySelectorAll("section[data-screen]")].some((s) => !s.hidden),
      };
      registerAll();
      const after = { hash: location.hash, events: early.slice() };
      const pass =
        before.hash === "#follow" &&
        before.events.length === 0 &&
        !before.anyVisible &&
        after.hash === "#identify" &&
        after.events[0] === "identify";
      const payload = { type: "boot-probe", pass, before, after };
      if (window.parent !== window) window.parent.postMessage(payload, "*");
      document.title = pass ? "BOOT-PROBE PASS" : "BOOT-PROBE FAIL";
      log("boot-probe " + (pass ? "PASS" : "FAIL"));
      refreshMeta();
      return payload;
    }

    async function runCases() {
      casesEl.replaceChildren();
      const results = [];

      go("identify");
      const enterA = lines().filter((t) => t === "enter identify").length;
      const eventA = lines().filter((t) => t === "event screen identify").length;
      const hashA = location.hash;
      go("identify");
      const enterB = lines().filter((t) => t === "enter identify").length;
      const eventB = lines().filter((t) => t === "event screen identify").length;
      results.push({
        name: "go(currentId) no-op",
        pass: enterB === enterA && eventB === eventA && hashA === "#identify" && location.hash === "#identify",
      });

      registerScreen("identify", {
        mount(root) {
          log("mount identify SECOND");
          if (root) root.textContent = "identify-2";
        },
        enter() {
          log("enter identify SECOND");
        },
        leave() {
          log("leave identify SECOND");
        },
      });
      go("confirm");
      go("identify");
      const rootText = document.querySelector('section[data-screen="identify"] [data-root]');
      const second = lines().some((t) => t.includes("SECOND"));
      results.push({
        name: "registerScreen keep mounted",
        pass: !second && rootText && rootText.textContent === "identify",
      });

      const entersBefore = lines().filter((t) => t.startsWith("enter ")).length;
      history.replaceState(null, "", location.pathname + location.search);
      window.dispatchEvent(new PopStateEvent("popstate", { state: null }));
      const entersAfter = lines().filter((t) => t.startsWith("enter ")).length;
      results.push({
        name: "popstate empty fall-through",
        pass: entersAfter === entersBefore && location.hash !== "#identify" && location.hash === "",
      });
      history.replaceState({ screen: "identify" }, "", "#identify");
      go("identify", { replace: true });

      const boot = await new Promise((resolve) => {
        const timer = setTimeout(() => resolve({ pass: false, timeout: true }), 3000);
        function onMsg(e) {
          if (!e.data || e.data.type !== "boot-probe") return;
          clearTimeout(timer);
          window.removeEventListener("message", onMsg);
          resolve(e.data);
        }
        window.addEventListener("message", onMsg);
        const iframe = document.createElement("iframe");
        iframe.title = "boot-probe";
        iframe.hidden = true;
        iframe.src = "/tools/test-bus?boot-probe=1#follow";
        document.body.appendChild(iframe);
      });
      results.push({ name: "boot after register", pass: !!boot.pass });

      results.forEach((r) => caseLine("CASE " + r.name + ": " + (r.pass ? "PASS" : "FAIL")));
      const all = results.every((r) => r.pass);
      caseLine(all ? "ALL PASS" : "FAIL");
      refreshMeta();
      return results;
    }

    document.getElementById("run-cases").addEventListener("click", () => {
      runCases();
    });
    window.runBusCases = runCases;

    if (bootProbe) {
      await probeBootRace();
    } else {
      registerAll();
      refreshMeta();
      if (autoCases) await runCases();
    }
  </script>
</body>
</html>
